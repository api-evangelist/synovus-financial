description: >-
  Synovus Financial Corp. was a Columbus, Georgia based regional bank holding company whose
  bank subsidiary, Synovus Bank, provides commercial and consumer banking, treasury and
  payment solutions (Synovus Gateway and the Accelerate AR, FX, Pay and Trade suite), wealth
  services and capital markets across Georgia, Alabama, Florida, South Carolina and Tennessee.
  Synovus combined with Pinnacle Financial Partners in 2026 — synovus.com states "Synovus and
  Pinnacle Financial Partners are now one firm" and investors.synovus.com redirects to
  investors.pnfp.com — so the surviving company is Pinnacle. Synovus
  publishes no public API contract: developer.synovus.com is a provisioned Akamai host that
  answers HTTP 403 Access Denied on every path from two networks, api.synovus.com does not
  resolve, and www.synovus.com serves no discovery documents. Treasury integration runs
  through partners — Gateway ERP (October 2025) is powered by Koxa — and the Maast
  subsidiary has been wound down.
